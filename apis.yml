apis:
- aid: community-labs:hypura
  name: Hypura Ollama-Compatible Inference API
  description: Hypura is a storage-tier-aware LLM inference scheduler for Apple Silicon
    that places model tensors across GPU, RAM, and NVMe tiers so models larger than
    physical memory can run. Running `hypura serve <model.gguf>` exposes a local
    Ollama-compatible HTTP API, making it a drop-in replacement for tooling that
    talks to Ollama. The server is local-first; there is no hosted endpoint.
  humanURL: https://github.com/t8/hypura
  baseURL: http://127.0.0.1:8080
