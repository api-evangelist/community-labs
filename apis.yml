aid: community-labs
name: Community Labs
description: 'Community Labs is an independent research organization founded in 2022
  by Tate Berenbaum, oriented toward a single belief: access to the future of intelligence
  should not be gate kept by the hardware people can afford. The company raised a $30M
  seed round led by Lightspeed Venture Partners, originally operating as a native software
  development company and venture studio accelerating developer tools and adoption of
  the Arweave permaweb, and has since refocused on local and consumer-hardware AI
  inference research. Its open source surface spans Hypura, a storage-tier-aware LLM
  inference scheduler for Apple Silicon that exposes an Ollama-compatible HTTP API,
  Autolab, an autonomous research orchestration framework, and the labscommunity
  GitHub organization of Arweave developer libraries including ArweaveKit, Arweave
  Wallet Kit, and the Arweave Storage SDK.'
